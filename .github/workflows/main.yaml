name: Publish container

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: rtorrent:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Check startup safety
        run: |
          docker run --rm --network=none \
            --mount type=bind,src="$PWD/tests",dst=/tests,readonly \
            --entrypoint sh rtorrent:test /tests/entrypoint.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA-$ARCH"
          docker tag rtorrent:test "$image"
          docker push "$image"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,prefix=branch-
            type=ref,event=tag,prefix=tag-
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          while IFS= read -r tag; do
            docker buildx imagetools create --tag "$tag" \
              "$image:sha-$GITHUB_SHA-amd64" \
              "$image:sha-$GITHUB_SHA-arm64"
            docker buildx imagetools inspect "$tag"
          done <<< "$TAGS"
