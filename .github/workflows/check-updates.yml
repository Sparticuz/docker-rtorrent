name: Check for rTorrent updates

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: check-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Check latest stable release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(grep -oP 'releases/download/v\K[0-9.]+(?=/)' Dockerfile | sort -u)
          [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ $(grep -c 'releases/download/' Dockerfile) -eq 2 ]]
          release=$(gh api repos/rakshasa/rtorrent/releases/latest)
          tag=$(jq -er 'select(.draft == false and .prerelease == false) | .tag_name' <<< "$release")
          version=${tag#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$version" == "$current" ]] || ! printf '%s\n' "$current" "$version" | sort -VC; then
            echo "No newer stable release (current: $current; upstream: $version)"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cp Dockerfile "$work/Dockerfile"
          escaped=${current//./\\.}
          for project in libtorrent rtorrent; do
            name="$project-$version.tar.gz"
            hash=$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$release")
            hash=${hash#sha256:}
            curl --fail --location --max-time 120 \
              "https://github.com/rakshasa/rtorrent/releases/download/v$version/$name" \
              --output "$work/$project.tar.gz"
            (cd "$work"; printf '%s  %s\n' "$hash" "$project.tar.gz" | sha256sum -c -)

            [[ $(grep -oF "$project-$current" Dockerfile | wc -l) -eq 2 ]]
            [[ $(grep -Ec "echo '[0-9a-f]{64}  $project\.tar\.gz'" Dockerfile) -eq 1 ]]
            sed -i -E \
              -e "s|releases/download/v$escaped/|releases/download/v$version/|g" \
              -e "s|$project-$escaped|$project-$version|g" \
              -e "s|[0-9a-f]{64}(  $project\.tar\.gz')|$hash\1|" \
              "$work/Dockerfile"
            [[ $(grep -oF "$project-$version" "$work/Dockerfile" | wc -l) -eq 2 ]]
            grep -Fq "$hash  $project.tar.gz'" "$work/Dockerfile"
          done
          # Keep the original untouched until both downloads and replacements pass.
          cp "$work/Dockerfile" Dockerfile
          echo "Updated rTorrent and libtorrent: $current -> $version"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and publish update
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "Update rTorrent and libtorrent to $VERSION"
          git push origin "HEAD:refs/heads/$BRANCH"
          # GITHUB_TOKEN pushes do not trigger another push workflow.
          gh workflow run main.yaml --ref "$BRANCH"
