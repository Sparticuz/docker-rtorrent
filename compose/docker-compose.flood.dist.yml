services:
  rtorrent:
    image: ghcr.io/sparticuz/docker-rtorrent:latest
    stop_grace_period: 2m
    volumes:
      - "./downloads:/downloads"
      - "./session:/session"
      - "./watch:/watch"
      - "./config:/config"
      - "rtorrent-sock:/socket"
    ports:
      - "49161:49161"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
  flood:
    image: jesec/flood
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["--host=0.0.0.0", "--rundir=/config", "--allowedpath=/downloads"]
    depends_on:
      - rtorrent
    volumes:
      - "rtorrent-sock:/socket"
      - "./flood:/config"
      - "./downloads:/downloads"
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  rtorrent-sock: {}
